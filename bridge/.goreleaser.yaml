# Bridge builds with GoReleaser OSS v2 (docs/releases.md). Runs from bridge/.
# `make dist` runs a snapshot build. A pushed bridge-v tag runs a release
# (.github/workflows/bridge-release.yml).
# Templates use BRIDGE_VERSION, not .Version, which keeps the bridge-v prefix.
version: 2
project_name: ogremcp-bridge

builds:
  # cgo for the tray code (§7). On an arm64 Mac the amd64 build is a
  # cross-compile, and Go turns cgo off for those unless CGO_ENABLED=1.
  # Without -mmacosx-version-min, clang targets the build machine's macOS, so
  # a binary with cgo code would not start on older versions. 13.0 is the
  # oldest macOS Go 1.27 supports, and LSMinimumSystemVersion in
  # macos/Info.plist. The flags go in CGO_CFLAGS, not MACOSX_DEPLOYMENT_TARGET,
  # because Go's build cache keys on them.
  - id: bridge-darwin
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=13.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=13.0
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Env.BRIDGE_VERSION }}"]
  # -H windowsgui keeps Windows from opening a console window.
  - id: bridge-windows
    goos: [windows]
    goarch: [amd64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -H windowsgui -X main.version={{ .Env.BRIDGE_VERSION }}"]

universal_binaries:
  - ids: [bridge-darwin]
    replace: true
    # App bundles and disk images are Pro-only, so scripts wrap the universal
    # binary in an .app, zip it, and put it in a disk image. Every build that
    # is not a snapshot is a release, and its app and disk image are Developer
    # ID signed and notarized or the build fails (§7). Snapshots get an ad hoc
    # signature only.
    hooks:
      post:
        - cmd: >-
            bash scripts/macos-app.sh "{{ .Path }}" "{{ .Env.BRIDGE_VERSION }}"
            "dist/Ogre MCP.app"
            "dist/{{ .ProjectName }}_{{ .Env.BRIDGE_VERSION }}_darwin_all.app.zip"
            "{{ if .IsSnapshot }}adhoc{{ else }}developer-id{{ end }}"
          output: true
        # The disk image, the macOS download (§7 Installer), holds the app
        # the hook above built. A release signs and notarizes it too, or fails.
        - cmd: >-
            bash scripts/macos-dmg.sh "dist/Ogre MCP.app"
            "dist/{{ .ProjectName }}_{{ .Env.BRIDGE_VERSION }}_darwin_all.dmg"
            "{{ if .IsSnapshot }}adhoc{{ else }}developer-id{{ end }}"
          output: true

# Windows only: the bare macOS binary would reach checksums.txt and a release
# without the .app's signature.
archives:
  - ids: [bridge-windows]
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Env.BRIDGE_VERSION }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/*.app.zip
    - glob: dist/*.dmg

# The repo's one Releases page also holds the addon-v releases (§5). A
# pre-release version, such as 1.2.3-rc.1, is never marked Latest. The
# prerelease key is not a template, and `auto` needs the semver parse that
# --skip=validate turns off, so the release workflow adds `prerelease: "true"`
# to this config for a pre-release version (docs/releases.md).
release:
  name_template: "Bridge {{ .Env.BRIDGE_VERSION }}"
  make_latest: '{{ if contains .Env.BRIDGE_VERSION "-" }}false{{ else }}true{{ end }}'
  extra_files:
    - glob: dist/*.app.zip
    - glob: dist/*.dmg
