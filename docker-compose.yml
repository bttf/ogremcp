# Self-hosted Open Gamer MCP (docs/architecture.md §13.3): the platform and
# its Postgres. Copy selfhost.env.example to .env, fill it in, and run
#
#   docker compose up
#
# docs/self-host.md has the steps.
name: ogmcp

services:
  postgres:
    # The major version the hosted service runs. A new major version cannot
    # read this one's data: moving to one takes a dump and a restore.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogmcp
      POSTGRES_DB: ogmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Over TCP: while it sets up a new volume, the image runs a server that
    # listens on no TCP address, so the check passes only once Postgres is up.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ogmcp", "-d", "ogmcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ogmcp:
    # The image applies the pending migrations, then starts the service.
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # An init process as PID 1 passes docker stop's SIGTERM on to the service.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # Every line of .env reaches the service. The two names below override it.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ogmcp:${POSTGRES_PASSWORD}@postgres:5432/ogmcp?sslmode=disable
      PORT: "4790"
    # This machine only. Other machines reach it through a reverse proxy that
    # terminates TLS (docs/self-host.md).
    ports:
      - "127.0.0.1:4790:4790"

volumes:
  postgres-data:
