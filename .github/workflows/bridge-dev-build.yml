# Unsigned dev builds of the bridge (§7, docs/releases.md): the Windows binary
# and the macOS universal binary as a zipped .app and in a disk image,
# uploaded as workflow artifacts. Runs on pushes to main that touch bridge/, and by hand for any
# branch. Not on PRs: macOS minutes count 10x against the Actions spending
# limit. It publishes no release, pushes no tag, and signs nothing: tagged,
# signed releases are .github/workflows/bridge-release.yml.
name: Bridge dev build

on:
  push:
    branches: [main]
    paths:
      - bridge/**
      - .github/workflows/bridge-dev-build.yml
      - .github/actions/install-goreleaser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The macOS build uses cgo, and the macOS scripts use Apple's tools.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The version comes from git describe over the bridge-v tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - uses: ./.github/actions/install-goreleaser

      # scripts/macos-app.sh checks that the macOS binary holds both arm64 and
      # x86_64 and that the .app's ad hoc signature verifies.
      # scripts/macos-dmg.sh checks the signature of the app in the disk image.
      - name: Build
        run: make -C bridge dist

      # The binary archive format names a binary only when GoReleaser uploads
      # it, so copy the Windows binary to that name.
      - name: Check and name the Windows binary
        working-directory: bridge
        run: |
          jq -r '.[] | select(.extra.Format == "binary" and .goos == "windows") | [.path, .name] | @tsv' dist/artifacts.json > windows.tsv
          test "$(wc -l < windows.tsv)" -eq 1
          IFS=$'\t' read -r path name < windows.tsv
          rm windows.tsv
          file "$path"
          file "$path" | grep -Eq 'PE32\+ executable.*\(GUI\).*x86-64'
          cp "$path" "dist/${name}"

      # Unzipped uploads: each artifact is named after its file.
      - uses: actions/upload-artifact@v7
        with:
          path: bridge/dist/*_windows_amd64.exe
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: bridge/dist/*_darwin_all.app.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: bridge/dist/*_darwin_all.dmg
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14
