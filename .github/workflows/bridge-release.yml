# Bridge releases (§5 Releases, §7, docs/releases.md). Pushing a bridge-v tag
# publishes: the release job builds the bridge with GoReleaser OSS, signs and
# notarizes the macOS app, and publishes the Windows binary, the zipped .app,
# and checksums.txt to the repo's Releases page as "Bridge X.Y.Z". Then the
# windows-installer job builds the Windows installer from the published binary
# and adds it to the same release.
#
# A manual run (workflow_dispatch) runs only the dry-run jobs: a snapshot build,
# as `make -C bridge dist` does, with an ad hoc signature, no secrets, and a
# read-only token, and the Windows installer built from it. It publishes
# nothing.
#
# The release job reads the signing secrets from the `release` environment, so
# every action is pinned by commit SHA and the Go cache is off. The
# certificate and key steps are adapted from bttf/wow-guide@df80260,
# .github/workflows/release.yml.
name: Bridge release

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # The macOS build uses cgo, and signing uses Apple's tools.
    runs-on: macos-latest
    timeout-minutes: 60
    # Holds the signing secrets. The owner limits it to bridge-v tags
    # (docs/releases.md, "Signing secrets").
    environment: release
    permissions:
      contents: write
    # One bridge release at a time, whatever the tag, and none is cancelled in
    # the middle of notarization or upload.
    concurrency:
      group: bridge-release
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # §7: a release never ships an unsigned macOS build. This runs first, so
      # a missing secret fails the job before it spends macOS minutes.
      - name: Check the signing secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Nothing was released. These secrets are not set in the release environment:${missing}. A bridge release signs and notarizes the macOS app and never ships it unsigned. Set the secrets (docs/releases.md, \"Signing secrets\"), then re-run this job."
            exit 1
          fi
          echo "All six signing secrets are set."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Every branch and tag: git describe finds the previous bridge-v tag,
          # and the next step reads refs/remotes/origin/main.
          fetch-depth: 0
          persist-credentials: false

      # docs/releases.md: a release is cut from a commit on main.
      - name: Check the tag
        run: |
          version=${TAG#bridge-v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${TAG} is not bridge-v followed by a version such as 1.2.3."
            exit 1
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::The checkout did not fetch main."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
            echo "::error::${TAG} points at ${TAG_SHA}, which is not on main. Tag a commit on main."
            exit 1
          fi

      # No cache: a release builds from nothing another run wrote.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bridge/go.mod
          cache: false

      - uses: ./.github/actions/install-goreleaser

      # A temporary keychain holds the Developer ID certificate for this job
      # only. The step exports the identity's SHA-1 hash, which is not secret.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::${keychain_password}"
          p12="${RUNNER_TEMP}/cert.p12"
          # Recorded first, so the cleanup step deletes the keychain even if a
          # later line fails.
          echo "MACOS_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          (umask 077 && printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$p12")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | grep "(${APPLE_TEAM_ID})" | awk '{print $2}' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate in MACOS_CERT_P12_BASE64 holds no Developer ID Application identity of the team in APPLE_TEAM_ID."
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key="${RUNNER_TEMP}/AuthKey.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key")
          echo "APPLE_API_KEY_PATH=${key}" >> "$GITHUB_ENV"

      # docs/releases.md, "A tag build". --skip=validate also turns off
      # GoReleaser's checks that the tree is clean and that HEAD is the tagged
      # commit, so this step runs both. The universal_binaries post hook signs
      # and notarizes the app before the checksums are written and anything is
      # uploaded (.goreleaser.yaml, scripts/macos-app.sh).
      - name: Build, sign, and publish
        working-directory: bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree is not clean."
            git status --short
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${TAG}^{commit}")" ]; then
            echo "::error::HEAD is not the commit ${TAG} points at."
            exit 1
          fi
          export GORELEASER_CURRENT_TAG=$TAG
          GORELEASER_PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'bridge-v*' "${TAG}^" 2>/dev/null || true)
          export GORELEASER_PREVIOUS_TAG
          export BRIDGE_VERSION=${TAG#bridge-v}
          if [ "${BRIDGE_VERSION#*-}" = "$BRIDGE_VERSION" ]; then
            goreleaser release --clean --skip=validate
            exit 0
          fi
          # A pre-release version, such as 1.2.3-rc.1, is published as a
          # pre-release. The prerelease key is not a template, so GoReleaser
          # reads the config from stdin with the key added.
          config=$(awk '{ print } /^release:$/ { print "  prerelease: \"true\"" }' .goreleaser.yaml)
          case $config in
            *'prerelease: "true"'*) ;;
            *)
              echo "::error::.goreleaser.yaml has no top-level release: line to add prerelease to."
              exit 1
              ;;
          esac
          printf '%s\n' "$config" | goreleaser release -f - --clean --skip=validate

      - name: Remove the keychain and the key
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN" || true
          fi
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/AuthKey.p8"

  # §7 Installer: the Inno Setup installer, built from the Windows binary the
  # release job published and added to the same release. Inno Setup runs only
  # on Windows, and GoReleaser OSS publishes from the one macOS job, so this
  # job runs after the release is out (docs/releases.md). It runs only when the
  # release job passed, so it never adds to a release without the signed macOS
  # app. The installer is unsigned (§7, D6).
  windows-installer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The installer holds the file checksums.txt lists, the one self-update
      # installs.
      - name: Download and check the Windows binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="ogremcp-bridge_${TAG#bridge-v}_windows_amd64.exe"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir build \
            --pattern "$exe" --pattern checksums.txt
          (cd build && awk -v f="$exe" '$2 == f' checksums.txt | sha256sum --check -)
          echo "EXE=build/${exe}" >> "$GITHUB_ENV"

      - name: Build the installer
        run: pwsh -NoProfile -File bridge/scripts/windows-installer.ps1 -Exe "$EXE" -OutDir build/installer

      - name: Add the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/installer/*_setup.exe --repo "$GITHUB_REPOSITORY"

  # A snapshot build with the release's toolchain. No environment, no secrets,
  # and a read-only token.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: bridge-release-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The version comes from git describe over the bridge-v tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bridge/go.mod
          cache: false

      - uses: ./.github/actions/install-goreleaser

      - name: Build a snapshot
        run: make -C bridge dist

      - name: List what a release would publish
        working-directory: bridge/dist
        run: |
          grep -q '_windows_amd64\.exe$' checksums.txt
          grep -q '_darwin_all\.app\.zip$' checksums.txt
          echo "A release publishes checksums.txt and the files it lists:"
          cat checksums.txt

      # The binary archive format names a binary only when GoReleaser uploads
      # it, so copy the Windows binary to that name for the installer job.
      - name: Name the Windows binary
        working-directory: bridge
        run: |
          jq -r '.[] | select(.extra.Format == "binary" and .goos == "windows") | [.path, .name] | @tsv' dist/artifacts.json > windows.tsv
          test "$(wc -l < windows.tsv)" -eq 1
          IFS=$'\t' read -r path name < windows.tsv
          rm windows.tsv
          cp "$path" "dist/${name}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binary
          path: bridge/dist/*_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

  # The Windows installer built from the dry run's binary, as the
  # windows-installer job builds it, then installed and uninstalled on the
  # runner. Nothing is published. The installer is kept as a workflow artifact
  # for testing on Windows.
  dry-run-windows-installer:
    needs: dry-run
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binary
          path: build

      - name: Build the installer
        run: pwsh -NoProfile -File bridge/scripts/windows-installer.ps1 -Exe build/*_windows_amd64.exe -OutDir build/installer

      # A silent install does not start the bridge (skipifsilent). The Run
      # value is the one the tray writes when start at login is on (package
      # autostart); the uninstaller removes it.
      - name: Install and uninstall
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem build/installer -Filter '*_setup.exe')
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)." }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Ogre MCP'
          $exe = Join-Path $dir 'ogremcp-bridge.exe'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Ogre MCP.lnk'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'

          $p = Start-Process -FilePath $setup[0].FullName -ArgumentList $silent -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with code $($p.ExitCode)." }
          if (-not (Test-Path -LiteralPath $exe)) { throw "Setup did not install $exe." }
          if (-not (Test-Path -LiteralPath $lnk)) { throw "Setup did not add $lnk." }
          Write-Host "Installed $exe and $lnk."

          New-ItemProperty -Path $run -Name OgreMCP -Value "`"$exe`"" -Force | Out-Null
          $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList $silent -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller exited with code $($p.ExitCode)." }
          # The uninstaller finishes in a copy of itself, which removes the folder.
          $deadline = (Get-Date).AddMinutes(1)
          while ((Test-Path -LiteralPath $dir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $dir) {
            Get-ChildItem -Force -LiteralPath $dir
            throw "The uninstaller left $dir."
          }
          if (Test-Path -LiteralPath $lnk) { throw "The uninstaller left $lnk." }
          if ($null -ne (Get-ItemProperty -Path $run -Name OgreMCP -ErrorAction SilentlyContinue)) {
            throw "The uninstaller left the Run value OgreMCP."
          }
          Write-Host "Uninstalled: the folder, the shortcut, and the Run value are gone."

      # Unzipped: the artifact is named after the installer.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/installer/*_setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
