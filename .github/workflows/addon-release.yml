# Addon releases (§5 Releases, docs/releases.md). Pushing an addon-v tag
# publishes: this job checks that the tag names the TOC `## Version` of
# kits/wow/adapter, zips the adapter as the folder players install
# (Interface/AddOns/OgreMCP), and publishes the zip to the repo's Releases page
# as "Addon X.Y.Z". The bridge installs the adapter from the platform (§8.2),
# not from this release.
#
# The job can write releases, so every action is pinned by commit SHA.
name: Addon release

on:
  push:
    tags: ["addon-v*"]

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # git describe finds the previous addon-v tag for the release notes.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the TOC version
        id: toc
        run: |
          version=$(scripts/check-addon-tag.sh "$TAG")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The folder is the one the manifest installs to (adapter.install), and
      # the zip holds the adapter's files as committed at the tag.
      - name: Zip the adapter
        id: zip
        env:
          VERSION: ${{ steps.toc.outputs.version }}
        run: |
          folder=$(git show "${TAG}:kits/wow/manifest.json" | jq -er '.adapter.install | split("/") | last')
          zip="${RUNNER_TEMP}/${folder}-${VERSION}.zip"
          git archive --format=zip --prefix="${folder}/" -o "$zip" "${TAG}:kits/wow/adapter"
          unzip -l "$zip"
          echo "path=${zip}" >> "$GITHUB_OUTPUT"

      # --latest=false keeps the Releases page's Latest label on the newest
      # bridge release, the download players start from (§7).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.toc.outputs.version }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          notes=(--generate-notes)
          previous=$(git describe --tags --abbrev=0 --match 'addon-v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            notes+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Addon ${VERSION}" --latest=false "${notes[@]}"
