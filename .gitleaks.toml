# gitleaks configuration. CI scans the full git history on every PR.
# Allowlist entries are for confirmed false positives only. Each entry names
# the file and the exact fabricated value, so a real secret in the same file
# still fails the scan.
[extend]
useDefault = true

# The dotted path of the Auctionator addon's public API table, a Lua global
# name and not a credential. The generic-api-key rule matches it because the
# constant that holds it is named AUCTIONATOR_API (RED-413).
[[allowlists]]
description = "The path of Auctionator's public API table in the WoW adapter"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^kits/wow/adapter/AuctionPrices\.lua$''']
regexes = ['''^Auctionator\.API\.v1\.$''']

# The same table name in the addon policy doc, where it follows the words
# "public API" (RED-413).
[[allowlists]]
description = "The name of Auctionator's public API table in the addon policy doc"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/addon-policy\.md$''']
regexes = ['''^Auctionator\.API\.v1$''']
